<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Happy Girlfriend's Day ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Animated Background -->

<div id="stars"></div>

<div id="hearts"></div>

<!-- INTRO -->

<section id="intro" class="page active">

<h1 class="logo">

Happy Girlfriend's Day ❤️

</h1>

<p>

A little surprise made with love...

</p>

<button id="startBtn">

Tap To Begin ❤️

</button>

</section>

<!-- SCANNER -->

<section id="scanner" class="page">

<h2>Soulmate Detection System</h2>

<div class="scanBox">

<p id="scanText">

Connecting...

</p>

<div class="progress">

<div id="progressBar"></div>

</div>

</div>

</section>

<!-- PHOTO -->

<section id="gallery" class="page">

<img id="photo"

src="photo1.jpg">

<div class="caption">

Every picture reminds me

how lucky I am ❤️

</div>

</section>

<!-- LETTER -->

<section id="letterPage"

class="page">

<div class="envelope">

<div class="letter">

<h2>

Dear Reesha ❤️

</h2>

<p id="typing"></p>

</div>

</div>

<button id="next">

One Last Surprise ❤️

</button>

</section>

<!-- FINAL -->

<section id="final"

class="page">

<div class="overlay"></div>

<img id="bgImage"

src="photo5.jpg">

<div class="glass">

<h1>

Piyush ❤️ Reesha

</h1>

<p>

Every love story is beautiful,

but ours is my favourite.

</p>

<h2>

Happy Girlfriend's Day ❤️

</h2>

</div>

<canvas id="fireworks">

</canvas>

</section>

<audio id="music"

loop>

<source src="music.mp3">

</audio>

<script src="script.js"></script>

</body>

</html>
